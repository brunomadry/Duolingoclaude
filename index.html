<!doctype html>
<html lang="pl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0d0e" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aka" />
    <meta name="description" content="Prywatna nauka japońskiego dla dwóch osób." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Aka Nihongo</title>
    <script>
      // Runs before CSS paints: apply the cached theme so there is no flash.
      (function () {
        var theme = 'dark';
        try {
          if (localStorage.getItem('aka.theme') === 'light') theme = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f1e9');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Aka Nihongo potrzebuje włączonego JavaScriptu.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
